<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four Hour Clock</title>
  <style>
    :root { --ink:#17232d; --muted:#6f7d87; --card:#fffdf8; --mint:#75e6c8; --sky:#79baff; --peach:#ffb38a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; color:var(--ink); font-family:ui-rounded,"Nunito",system-ui,sans-serif; background:linear-gradient(140deg,#c7f4ed,#dcecff 55%,#fff0ca); }
    body::before, body::after { content:""; position:fixed; border-radius:50%; filter:blur(2px); opacity:.55; z-index:-1; }
    body::before { width:18rem;height:18rem;background:#ffcf9e;left:-5rem;top:-5rem; }
    body::after { width:22rem;height:22rem;background:#a4dcff;right:-8rem;bottom:-8rem; }
    main { width:min(92vw,430px); padding:30px 25px 22px; text-align:center; background:rgba(255,253,248,.84); border:1px solid rgba(255,255,255,.9); border-radius:32px; box-shadow:0 22px 70px rgba(45,87,112,.20); backdrop-filter:blur(12px); }
    .eyebrow { margin:0; color:var(--muted); font-size:.72rem; letter-spacing:.16em; font-weight:800; text-transform:uppercase; }
    h1 { margin:7px 0 2px; font-size:clamp(2.75rem,12vw,4.3rem); line-height:1; letter-spacing:-.07em; font-variant-numeric:tabular-nums; }
    h1.waiting { font-size:2.2rem; letter-spacing:-.04em; color:#8d9aa2; }
    .message { min-height:25px; margin:14px 0 25px; color:var(--muted); font-size:.94rem; }
    .message b { color:var(--ink); }
    .progress { height:12px; margin:0 3px 28px; overflow:hidden; border-radius:99px; background:#e7edf0; }
    .progress span { display:block; width:0%; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--sky),var(--mint)); transition:width .5s ease; }
    .swipes { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
    button { border:0; cursor:pointer; color:var(--ink); font:inherit; font-weight:900; border-radius:20px; padding:17px 8px 15px; box-shadow:0 6px 0 rgba(23,35,45,.16), 0 12px 18px rgba(23,35,45,.11); transition:transform .16s cubic-bezier(.2,1.6,.5,1), box-shadow .16s, filter .2s; }
    button:hover:not(:disabled) { transform:translateY(-4px) rotate(-1deg); box-shadow:0 10px 0 rgba(23,35,45,.14),0 18px 22px rgba(23,35,45,.13); }
    button:nth-child(2):hover:not(:disabled) { transform:translateY(-4px) rotate(1deg); }
    button:active:not(:disabled) { transform:translateY(5px) scale(.96); box-shadow:0 1px 0 rgba(23,35,45,.15); }
    button:disabled { cursor:not-allowed; filter:grayscale(.7); opacity:.42; box-shadow:0 3px 0 rgba(23,35,45,.11); }
    .in { background:var(--mint); } .out { background:var(--peach); }
    .icon { display:block; margin-bottom:3px; font-size:1.65rem; transition:transform .35s cubic-bezier(.2,1.7,.4,1); }
    button:hover .icon { transform:translateX(7px) rotate(-12deg) scale(1.18); }
    .out:hover .icon { transform:translateX(-7px) rotate(12deg) scale(1.18); }
    .hint { margin:20px 0 0; color:#91a0a8; font-size:.74rem; }
    .credit { margin:16px -25px -22px; padding:12px 25px 14px; border-top:1px solid rgba(23,35,45,.07); color:#9aa8b0; font-size:.68rem; letter-spacing:.14em; font-weight:800; text-transform:uppercase; }
    .reset { margin-top:28px; padding:7px 12px; border-radius:8px; background:transparent; box-shadow:none; color:#87959d; font-size:.75rem; font-weight:700; }
    .reset:hover { transform:none!important; box-shadow:none; color:#e5674d; }
    .reset.armed { color:#e5674d; }
    .burst { position:fixed; pointer-events:none; font-size:1.35rem; animation:pop .8s ease-out forwards; }
    @keyframes pop { from { opacity:1; transform:translate(-50%,-50%) scale(.4); } to { opacity:0; transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(60deg) scale(1.4); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Your escape time</p>
    <h1 id="time" class="waiting">Swipe in</h1>
    <p class="message" id="message">Your four-hour work clock is waiting.</p>
    <div class="progress" aria-label="Work time completed"><span id="bar"></span></div>
    <div class="swipes">
      <button class="in" id="in"><span class="icon">→</span>Swipe in</button>
      <button class="out" id="out" disabled><span class="icon">←</span>Swipe out</button>
    </div>
    <button class="reset" id="reset">Start over</button>
    <p class="hint">Time away is paused and deducted automatically.</p>
    <footer class="credit">A Sandeep Kumar production</footer>
  </main>
  <script>
    const target = 4 * 60 * 60 * 1000;
    const storageKey = "four-hour-clock-visits";
    const $ = id => document.getElementById(id);
    const ui = { time: $("time"), message: $("message"), bar: $("bar"), in: $("in"), out: $("out") };
    function loadVisits() {
      try {
        const stored = JSON.parse(localStorage.getItem(storageKey));
        if (!Array.isArray(stored)) return [];
        return stored.filter(visit =>
          Number.isFinite(visit?.in) &&
          (visit.out === null || (Number.isFinite(visit.out) && visit.out >= visit.in))
        );
      } catch {
        return [];
      }
    }
    function saveVisits() { localStorage.setItem(storageKey, JSON.stringify(visits)); }
    let visits = loadVisits(), completedBurst = false;

    const active = () => visits.at(-1)?.out === null;
    const worked = now => visits.reduce((total, visit) => total + ((visit.out ?? now) - visit.in), 0);
    const clock = ms => new Date(ms).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
    const duration = ms => { const minutes = Math.ceil(Math.max(0,ms) / 60000); return `${Math.floor(minutes/60)}h ${String(minutes%60).padStart(2,"0")}m`; };
    function logoutTime(now) {
      let total = 0;
      for (const visit of visits) { const span = (visit.out ?? now) - visit.in; if (total + span >= target) return visit.in + target - total; total += span; }
      return active() ? now + target - total : null;
    }
    function spark(button, symbols) {
      const r = button.getBoundingClientRect();
      for (let i=0;i<9;i++) { const bit=document.createElement("i"); bit.className="burst"; bit.textContent=symbols[i%symbols.length]; bit.style.left=`${r.left+r.width/2}px`; bit.style.top=`${r.top+r.height/2}px`; bit.style.setProperty("--x",`${(Math.random()-.5)*150}px`); bit.style.setProperty("--y",`${(Math.random()-.5)*130}px`); document.body.append(bit); setTimeout(()=>bit.remove(),850); }
    }
    function render() {
      const now=Date.now(), total=worked(now), remaining=Math.max(0,target-total), exit=logoutTime(now), done=total>=target;
      ui.bar.style.width=`${Math.min(100,total/target*100)}%`;
      ui.in.disabled=active(); ui.out.disabled=!active();
      if (!visits.length) { ui.time.textContent="Swipe in"; ui.time.className="waiting"; ui.message.textContent="Your four-hour work clock is waiting."; return; }
      ui.time.className="";
      if (done) { ui.time.textContent="All done!"; ui.message.innerHTML="Four hours complete — <b>you’re free to go.</b>"; if (!completedBurst) { completedBurst=true; spark(ui.out,["✨","🎉","🌟"]); } }
      else if (exit) { ui.time.textContent=clock(exit); ui.message.innerHTML=`<b>${duration(remaining)}</b> left on the clock.`; }
      else { ui.time.textContent="Paused"; ui.message.innerHTML=`<b>${duration(remaining)}</b> remains. Swipe in to continue.`; }
    }
    ui.in.onclick=()=>{ if (!active()) { visits.push({in:Date.now(),out:null}); saveVisits(); spark(ui.in,["☀️","⚡","💼"]); render(); } };
    ui.out.onclick=()=>{ if (active()) { visits.at(-1).out=Date.now(); saveVisits(); spark(ui.out,["🌿","☕","💨"]); render(); } };
    let resetTimer;
    const resetButton = $("reset");
    function disarmReset() {
      clearTimeout(resetTimer);
      resetTimer = undefined;
      resetButton.textContent = "Start over";
      resetButton.classList.remove("armed");
    }
    resetButton.onclick=()=>{
      if (!resetTimer) {
        resetButton.textContent = "Sure? Tap again";
        resetButton.classList.add("armed");
        resetTimer = setTimeout(disarmReset, 3000);
        return;
      }
      disarmReset();
      visits=[];
      completedBurst=false;
      localStorage.removeItem(storageKey);
      render();
    };
    render(); setInterval(render,1000);
  </script>
</body>
</html>
