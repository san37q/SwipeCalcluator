<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Logout Time</title>
<meta name="theme-color" content="#fbfaf8" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕓</text></svg>" />
<style>
  :root{
    --bg: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #f8fafc 100%);
    --ink: #0f172a;
    --muted: #64748b;
    --green: #10b981;
    --accent-blue: #3b82f6;
    --accent-purple: #8b5cf6;
    --accent-cyan: #0891b2;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    background: var(--bg);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:32px 22px calc(32px + env(safe-area-inset-bottom));
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height: 100vh;
  }

  main{width:100%;max-width:380px;text-align:center}

  /* ---------- the number ---------- */
  .label{
    font-size:12px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--muted);font-weight:700;margin-top:20px;
  }

  .time{
    font-size:clamp(56px,18vw,72px);
    font-weight:700;letter-spacing:-.02em;line-height:1.1;
    font-variant-numeric:tabular-nums;
    margin:12px 0 0;
    transition:all .4s cubic-bezier(.34,.5,.5,1);
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .time em{font-style:normal;font-size:.35em;font-weight:600;letter-spacing:0;margin-left:8px;background:linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .time.pending{opacity:.6;font-size:clamp(42px,12vw,52px);}
  .time.done{background:linear-gradient(135deg, #10b981, #34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:pulse 1.5s ease-in-out infinite}

  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

  .sub{
    font-size:14px;color:var(--muted);margin-top:14px;
    font-variant-numeric:tabular-nums;min-height:22px;
    letter-spacing:.01em;
  }
  .sub b{color:var(--accent-cyan);font-weight:700}

  /* ---------- select dropdown ---------- */
  #hoursSelect{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.005em;
    background:linear-gradient(135deg, rgba(59, 130, 246, 0.06), rgba(8, 145, 178, 0.06));
    border:none;border-radius:8px;
    padding:8px 12px;cursor:pointer;width:auto;min-width:140px;
    transition:all .3s cubic-bezier(.34,1.7,.5,1);
    box-shadow:0 1px 4px rgba(0, 0, 0, 0.04);
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 16px;
    padding-right: 32px;
    vertical-align: middle;
  }
  #hoursSelect:hover{
    background:linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(8, 145, 178, 0.1));
    box-shadow:0 2px 6px rgba(59, 130, 246, 0.08);
    transform:translateY(-0.5px);
  }
  #hoursSelect:focus{
    outline:none;
    background:linear-gradient(135deg, rgba(59, 130, 246, 0.12), rgba(8, 145, 178, 0.12));
    box-shadow:0 2px 8px rgba(59, 130, 246, 0.12);
    transform:translateY(-0.5px);
  }
  #hoursSelect option{
    background:#f8fafc;
    color:var(--ink);
    padding:8px 10px;
    font-weight:600;
    font-size:13px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }

  /* ---------- buttons ---------- */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:40px}
  .btn{
    position:relative;overflow:hidden;
    border:none;border-radius:14px;padding:18px 12px 17px;
    font:inherit;font-size:15px;font-weight:700;letter-spacing:-.01em;
    color:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:all .25s cubic-bezier(.34,1.7,.5,1);
    will-change:transform;
  }
  .btn .emoji{font-size:26px;line-height:1;transition:all .3s cubic-bezier(.34,1.8,.5,1)}
  .btn::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.25),transparent 60%)}
  .btn:hover:not(:disabled)::before{opacity:1}

  .btn.in{background:linear-gradient(135deg,#10b981 0%,#059669 100%);box-shadow:0 8px 32px rgba(16,185,129,.35),0 2px 8px rgba(0,0,0,.3)}
  .btn.out{background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);box-shadow:0 8px 32px rgba(245,158,11,.35),0 2px 8px rgba(0,0,0,.3)}

  .btn.in:hover:not(:disabled){transform:translateY(-3px) scale(1.03);box-shadow:0 12px 40px rgba(16,185,129,.45)}
  .btn.out:hover:not(:disabled){transform:translateY(-3px) scale(1.03);box-shadow:0 12px 40px rgba(245,158,11,.45)}
  .btn.in:hover:not(:disabled) .emoji{transform:scale(1.32) rotate(-12deg)}
  .btn.out:hover:not(:disabled) .emoji{transform:scale(1.32) rotate(12deg)}

  .btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
  .btn.in:active:not(:disabled){box-shadow:0 4px 16px rgba(16,185,129,.25)}
  .btn.out:active:not(:disabled){box-shadow:0 4px 16px rgba(245,158,11,.25)}

  .btn:disabled{filter:grayscale(1) opacity(.4);cursor:not-allowed}
  .btn.nope{animation:nope .38s cubic-bezier(.36,.07,.19,.97)}
  @keyframes nope{10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

  /* ---------- target hit: the buttons throw a party ---------- */
  .btn.party{animation:dance 1.15s ease-in-out infinite}
  .btn.in.party{--lean:-1}
  .btn.out.party{--lean:1;animation-delay:.18s}
  .btn.party:disabled{filter:none;opacity:.85}
  @keyframes dance{
    0%,100%{transform:none}
    18%{transform:translateY(-12px) rotate(calc(var(--lean) * 6deg)) scale(1.08)}
    36%{transform:translateY(0) rotate(calc(var(--lean) * -2deg)) scale(.97)}
    54%{transform:translateY(-7px) rotate(calc(var(--lean) * -5deg)) scale(1.05)}
    72%{transform:translateY(0) rotate(calc(var(--lean) * 2deg)) scale(.98)}
    86%{transform:translateY(-3px) rotate(calc(var(--lean) * 3deg)) scale(1.02)}
  }
  .btn.party .emoji{animation:giggle .34s ease-in-out infinite}
  @keyframes giggle{
    0%,100%{transform:rotate(-12deg) scale(1.15)}
    50%{transform:rotate(12deg) scale(1.25)}
  }
  .btn.party:active:not(:disabled){animation:none;transform:translateY(1px) scale(.98)}
  .btn.party.nope{animation:nope .38s cubic-bezier(.36,.07,.19,.97)}

  /* ---------- talk track ---------- */
  .quip{font-size:13px;color:var(--muted);margin-top:18px;min-height:20px;letter-spacing:.01em}
  .quip.pop{animation:pop .4s cubic-bezier(.34,1.6,.5,1)}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}

  /* ---------- reset ---------- */
  .reset{
    font:inherit;font-size:13px;font-weight:600;color:var(--muted);
    background:rgba(100,116,139,.06);border:none;cursor:pointer;padding:10px 14px;
    margin-top:24px;border-radius:10px;transition:all .25s ease;
  }
  .reset:hover{color:var(--accent-cyan);background:rgba(8,145,178,.1)}
  .reset:active{transform:scale(.96)}
  .reset.armed{color:var(--accent-cyan);background:rgba(8,145,178,.15);font-weight:700}
  .reset[hidden]{display:none}

  .sig{font-size:12px;color:var(--muted);margin-top:40px;letter-spacing:.02em;opacity:.8}
  .sig b{font-weight:700;color:var(--accent-cyan)}

  /* ---------- fx ---------- */
  #fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
  .flyer{position:absolute;font-size:24px;animation:fly .95s ease-out forwards}
  @keyframes fly{
    0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 100px)) scale(1.3) rotate(var(--rot))}
  }
  .confetti{position:absolute;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{
    0%{opacity:1;transform:translateY(-20px) rotate(0)}
    100%{opacity:0;transform:translateY(105vh) rotate(760deg)}
  }

  @media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main>
  <div style="padding-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap">
    <span class="label" style="margin:0;white-space:nowrap">Daily hours:</span>
    <select id="hoursSelect">
      <option value="4">4 hours</option>
      <option value="6">6 hours</option>
      <option value="8">8 hours</option>
    </select>
  </div>

  <div style="margin-top:32px">
    <div class="label">You can log out at</div>
    <div class="time pending" id="logout">—:—</div>
    <div class="sub" id="sub"></div>
  </div>

  <div class="actions">
    <button class="btn in" id="btnIn"><span class="emoji">🏢</span><span>Swipe In</span></button>
    <button class="btn out" id="btnOut"><span class="emoji">🏃</span><span>Swipe Out</span></button>
  </div>
  <div class="quip" id="quip">Tap Swipe In when you badge into the office.</div>

  <button class="reset" id="btnReset" hidden>Reset day</button>

  <p class="sig">a <b>Sandeep Kumar</b> production</p>
</main>

<div id="fx"></div>

<script>
(() => {
  "use strict";

  /* Sessions are [{ in: <ms>, out: <ms|null> }]. Time "inside" is the sum of
     every in→out span; the gaps between them are free. Logout time is the
     instant that sum reaches TARGET. */
  const KEY = "logout-timer/v2";
  const HOURS_KEY = "logout-timer/hours";
  let TARGET = 4 * 60 * 60 * 1000;

  let sessions = [];
  let celebrated = false;

  const $ = id => document.getElementById(id);
  const el = {
    logout: $("logout"), sub: $("sub"), quip: $("quip"), fx: $("fx"),
    btnIn: $("btnIn"), btnOut: $("btnOut"), btnReset: $("btnReset"),
    hoursSelect: $("hoursSelect")
  };

  /* ------------------------------ storage ------------------------------ */
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ day: dayKey(), sessions, celebrated })); }
    catch (_) { /* private mode — run in memory */ }
  }

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!raw || raw.day !== dayKey()) return;   // new calendar day = fresh sheet
      if (Array.isArray(raw.sessions)) sessions = raw.sessions;
      celebrated = !!raw.celebrated;
    } catch (_) { /* corrupt entry — start clean */ }
  }

  function setHours(hours) {
    TARGET = hours * 60 * 60 * 1000;
    try { localStorage.setItem(HOURS_KEY, hours.toString()); }
    catch (_) { /* private mode — run in memory */ }
    celebrated = false;
    save();
    render();
  }

  function loadHours() {
    try {
      const saved = localStorage.getItem(HOURS_KEY);
      if (saved) {
        const hours = parseInt(saved, 10);
        el.hoursSelect.value = hours.toString();
        setHours(hours);
      }
    } catch (_) { /* corrupt entry — use default */ }
  }

  /* ------------------------------ the math ----------------------------- */
  const isIn = () => sessions.length > 0 && sessions[sessions.length - 1].out === null;

  const insideMs = now => sessions.reduce((sum, s) => sum + ((s.out ?? now) - s.in), 0);

  // Clock instant at which inside-time hits TARGET; null if we're outside
  // and haven't got there yet.
  function logoutAt(now) {
    let acc = 0;
    for (const s of sessions) {
      const span = (s.out ?? now) - s.in;
      if (acc + span >= TARGET) return s.in + (TARGET - acc);
      acc += span;
    }
    return isIn() ? now + (TARGET - acc) : null;
  }

  const fmtClock = ts => new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

  function fmtDur(ms, withSecs) {
    ms = Math.max(0, Math.round(ms / 1000) * 1000);
    const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
    const pad = n => String(n).padStart(2, "0");
    return withSecs && h === 0 ? `${m}m ${pad(s)}s` : `${h}h ${pad(m)}m`;
  }

  /* ------------------------------- quips ------------------------------- */
  const QUIPS = {
    in:  ["Clocked in. The grind begins. 💼", "You're inside! Coffee counts as work. ☕",
          "Badge beeped. Timer running. ⏱️", "Back at it. Look busy. 👀",
          "The chair missed you. 🪑", "Focus mode: allegedly on. 🧠"],
    out: ["Stepped out. Timer paused. 🧊", "Break well earned. 🍵",
          "Escaped! Temporarily. 🚪", "Clock's chilling till you're back. 😌",
          "Snack run detected. 🍪", "Touching grass. Approved. 🌿"],
    dblIn:  ["You're already inside, champ. 😅", "Can't enter twice. Physics. 🙃"],
    dblOut: ["You're not even in yet! 🤨", "Swipe in first, escape later. 🚧"]
  };
  const pick = a => a[Math.floor(Math.random() * a.length)];

  const getDoneQuips = () => [
    `${TARGET / 3600000} hours cleared — you're free! 🎉`,
    "Target hit. Go live your life. 🥳"
  ];

  function say(text) {
    el.quip.textContent = text;
    el.quip.classList.remove("pop");
    void el.quip.offsetWidth;          // restart the animation
    el.quip.classList.add("pop");
  }

  /* -------------------------------- fx --------------------------------- */
  function flyEmoji(btn, chars) {
    const r = btn.getBoundingClientRect();
    for (let i = 0; i < 6; i++) {
      const n = document.createElement("div");
      n.className = "flyer";
      n.textContent = chars[i % chars.length];
      n.style.left = r.left + r.width * (0.2 + Math.random() * 0.6) + "px";
      n.style.top = r.top + r.height * 0.4 + "px";
      n.style.setProperty("--dx", (Math.random() * 90 - 45).toFixed(0) + "px");
      n.style.setProperty("--rot", (Math.random() * 90 - 45).toFixed(0) + "deg");
      n.style.animationDelay = (i * 45) + "ms";
      el.fx.appendChild(n);
      setTimeout(() => n.remove(), 1200);
    }
  }

  function confetti() {
    const colors = ["#10b981", "#f59e0b", "#3b82f6", "#8b5cf6", "#06b6d4"];
    for (let i = 0; i < 70; i++) {
      const n = document.createElement("div");
      n.className = "confetti";
      n.style.left = Math.random() * 100 + "vw";
      n.style.background = colors[i % colors.length];
      n.style.animationDuration = (1.9 + Math.random() * 1.6) + "s";
      n.style.animationDelay = (Math.random() * 0.5) + "s";
      el.fx.appendChild(n);
      setTimeout(() => n.remove(), 4200);
    }
  }

  function nope(btn, msgs) {
    btn.classList.remove("nope");
    void btn.offsetWidth;
    btn.classList.add("nope");
    say(pick(msgs));
  }

  /* ------------------------------- render ------------------------------ */
  function render() {
    const now = Date.now();
    const inside = insideMs(now);
    const left = Math.max(0, TARGET - inside);
    const done = inside >= TARGET;
    const active = isIn();
    const at = logoutAt(now);

    el.logout.className = "time" + (done ? " done" : at === null ? " pending" : "");
    if (at !== null) el.logout.innerHTML = fmtClock(at).replace(/\s?([AP]M)$/i, "<em>$1</em>");
    else el.logout.textContent = sessions.length ? "paused" : "—:—";

    const hours = TARGET / 3600000;
    if (done)                 el.sub.innerHTML = `Free since <b>${fmtClock(at)}</b> — go home 🎉`;
    else if (active)          el.sub.innerHTML = `<b>${fmtDur(left, true)}</b> to go · inside ${fmtDur(inside)}`;
    else if (sessions.length) el.sub.innerHTML = `Swipe in now → out at <b>${fmtClock(now + left)}</b>`;
    else                      el.sub.innerHTML = `Swipe in to start the ${hours}-hour clock`;

    el.btnIn.disabled = active;
    el.btnOut.disabled = !active;
    el.btnReset.hidden = sessions.length === 0;

    // Target reached — let them boogie until the day is reset.
    el.btnIn.classList.toggle("party", done);
    el.btnOut.classList.toggle("party", done);

    if (done && !celebrated) {
      celebrated = true;
      confetti();
      say(pick(getDoneQuips()));
      save();
    }
  }

  /* ------------------------------ actions ------------------------------ */
  el.btnIn.addEventListener("click", () => {
    if (isIn()) return nope(el.btnIn, QUIPS.dblIn);
    sessions.push({ in: Date.now(), out: null });
    flyEmoji(el.btnIn, ["✅", "💼", "⚡", "🚀"]);
    say(pick(QUIPS.in));
    save(); render();
  });

  el.btnOut.addEventListener("click", () => {
    if (!isIn()) return nope(el.btnOut, QUIPS.dblOut);
    sessions[sessions.length - 1].out = Date.now();
    flyEmoji(el.btnOut, ["🏃", "💨", "🍃", "🎈"]);
    say(pick(QUIPS.out));
    save(); render();
  });

  // Reset confirms in place — no browser dialog.
  let armed = null;
  el.btnReset.addEventListener("click", () => {
    if (!armed) {
      el.btnReset.textContent = "Sure? Tap again";
      el.btnReset.classList.add("armed");
      armed = setTimeout(disarm, 3000);
      return;
    }
    clearTimeout(armed); disarm();
    sessions = []; celebrated = false;
    say("Clean slate. Pretend today just started. 🧼");
    save(); render();
  });

  function disarm() {
    armed = null;
    el.btnReset.textContent = "Reset day";
    el.btnReset.classList.remove("armed");
  }

  // pointer-tracked shine
  for (const b of [el.btnIn, el.btnOut]) {
    b.addEventListener("pointermove", e => {
      const r = b.getBoundingClientRect();
      b.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 100) + "%");
      b.style.setProperty("--my", ((e.clientY - r.top) / r.height * 100) + "%");
    });
  }

  // hours selector
  el.hoursSelect.addEventListener("change", e => {
    setHours(parseInt(e.target.value, 10));
  });

  /* -------------------------------- boot ------------------------------- */
  load();
  loadHours();
  render();
  setInterval(render, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
