<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Logout Time</title>
<meta name="theme-color" content="#fbfaf8" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕓</text></svg>" />
<style>
  :root{ --bg:#fbfaf8; --ink:#16150f; --muted:#96917f; --green:#12a150; }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}

  body{
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:32px 22px calc(32px + env(safe-area-inset-bottom));
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  main{width:100%;max-width:340px;text-align:center}

  /* ---------- the number ---------- */
  .label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;
    color:var(--muted);font-weight:600;
  }
  .time{
    font-size:clamp(52px,17vw,68px);
    font-weight:660;letter-spacing:-.04em;line-height:1.05;
    font-variant-numeric:tabular-nums;
    margin:10px 0 0;
    transition:color .35s;
  }
  .time em{font-style:normal;font-size:.4em;font-weight:600;letter-spacing:0;margin-left:5px;color:var(--muted)}
  .time.pending{color:#cdc8ba;font-size:clamp(34px,10vw,42px);letter-spacing:-.02em}
  .time.done{color:var(--green)}

  .sub{
    font-size:13px;color:var(--muted);margin-top:12px;
    font-variant-numeric:tabular-nums;min-height:20px;
  }
  .sub b{color:var(--ink);font-weight:600}

  /* ---------- buttons ---------- */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:38px}
  .btn{
    position:relative;overflow:hidden;
    border:none;border-radius:16px;padding:17px 8px 16px;
    font:inherit;font-size:15px;font-weight:650;letter-spacing:-.01em;
    color:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:transform .16s cubic-bezier(.34,1.7,.5,1),box-shadow .16s,filter .16s,opacity .25s;
    will-change:transform;
  }
  .btn .emoji{font-size:23px;line-height:1;transition:transform .3s cubic-bezier(.34,1.8,.5,1)}
  .btn::after{
    content:"";position:absolute;inset:0;opacity:0;transition:opacity .3s;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.32),transparent 60%);
  }
  .btn:hover:not(:disabled)::after{opacity:1}

  .btn.in{background:linear-gradient(160deg,#18b95c,#0d8f43);box-shadow:0 5px 0 #0a6c33,0 12px 22px -12px rgba(13,143,67,.75)}
  .btn.out{background:linear-gradient(160deg,#f2a413,#d47f04);box-shadow:0 5px 0 #a86205,0 12px 22px -12px rgba(212,127,4,.7)}

  .btn.in:hover:not(:disabled){transform:translateY(-2px) rotate(-.8deg)}
  .btn.out:hover:not(:disabled){transform:translateY(-2px) rotate(.8deg)}
  .btn.in:hover:not(:disabled) .emoji{transform:scale(1.24) rotate(-10deg)}
  .btn.out:hover:not(:disabled) .emoji{transform:scale(1.24) rotate(10deg)}

  .btn:active:not(:disabled){transform:translateY(5px) scale(.97)}
  .btn.in:active:not(:disabled){box-shadow:0 0 0 #0a6c33}
  .btn.out:active:not(:disabled){box-shadow:0 0 0 #a86205}

  .btn:disabled{filter:grayscale(.9) brightness(1.24);opacity:.42;cursor:not-allowed;box-shadow:0 3px 0 rgba(0,0,0,.07)}
  .btn.nope{animation:nope .38s cubic-bezier(.36,.07,.19,.97)}
  @keyframes nope{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

  /* ---------- talk track ---------- */
  .quip{font-size:12.5px;color:var(--muted);margin-top:16px;min-height:19px}
  .quip.pop{animation:pop .4s cubic-bezier(.34,1.6,.5,1)}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}

  /* ---------- reset ---------- */
  .reset{
    font:inherit;font-size:12px;font-weight:500;color:#bdb8a8;
    background:none;border:none;cursor:pointer;padding:8px 10px;
    margin-top:20px;border-radius:8px;transition:color .18s,transform .18s;
  }
  .reset:hover{color:#c2410c}
  .reset:active{transform:scale(.93)}
  .reset.armed{color:#c2410c;font-weight:600}
  .reset[hidden]{display:none}

  .sig{font-size:11px;color:#c5c0b1;margin-top:34px;letter-spacing:.02em}
  .sig b{font-weight:600;color:#a8a394}

  /* ---------- fx ---------- */
  #fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
  .flyer{position:absolute;font-size:22px;animation:fly .95s ease-out forwards}
  @keyframes fly{
    0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 92px)) scale(1.25) rotate(var(--rot))}
  }
  .confetti{position:absolute;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{
    0%{opacity:1;transform:translateY(-20px) rotate(0)}
    100%{opacity:0;transform:translateY(105vh) rotate(760deg)}
  }

  @media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main>
  <div class="label">You can log out at</div>
  <div class="time pending" id="logout">—:—</div>
  <div class="sub" id="sub"></div>

  <div class="actions">
    <button class="btn in" id="btnIn"><span class="emoji">🏢</span>Swipe In</button>
    <button class="btn out" id="btnOut"><span class="emoji">🏃</span>Swipe Out</button>
  </div>
  <div class="quip" id="quip">Tap Swipe In when you badge into the office.</div>

  <button class="reset" id="btnReset" hidden>Reset day</button>

  <p class="sig">a <b>Sandeep Kumar</b> production</p>
</main>

<div id="fx"></div>

<script>
(() => {
  "use strict";

  /* Sessions are [{ in: <ms>, out: <ms|null> }]. Time "inside" is the sum of
     every in→out span; the gaps between them are free. Logout time is the
     instant that sum reaches TARGET. */
  const KEY = "logout-timer/v2";
  const TARGET = 4 * 60 * 60 * 1000;

  let sessions = [];
  let celebrated = false;

  const $ = id => document.getElementById(id);
  const el = {
    logout: $("logout"), sub: $("sub"), quip: $("quip"), fx: $("fx"),
    btnIn: $("btnIn"), btnOut: $("btnOut"), btnReset: $("btnReset")
  };

  /* ------------------------------ storage ------------------------------ */
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ day: dayKey(), sessions, celebrated })); }
    catch (_) { /* private mode — run in memory */ }
  }

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!raw || raw.day !== dayKey()) return;   // new calendar day = fresh sheet
      if (Array.isArray(raw.sessions)) sessions = raw.sessions;
      celebrated = !!raw.celebrated;
    } catch (_) { /* corrupt entry — start clean */ }
  }

  /* ------------------------------ the math ----------------------------- */
  const isIn = () => sessions.length > 0 && sessions[sessions.length - 1].out === null;

  const insideMs = now => sessions.reduce((sum, s) => sum + ((s.out ?? now) - s.in), 0);

  // Clock instant at which inside-time hits TARGET; null if we're outside
  // and haven't got there yet.
  function logoutAt(now) {
    let acc = 0;
    for (const s of sessions) {
      const span = (s.out ?? now) - s.in;
      if (acc + span >= TARGET) return s.in + (TARGET - acc);
      acc += span;
    }
    return isIn() ? now + (TARGET - acc) : null;
  }

  const fmtClock = ts => new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

  function fmtDur(ms, withSecs) {
    ms = Math.max(0, Math.round(ms / 1000) * 1000);
    const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
    const pad = n => String(n).padStart(2, "0");
    return withSecs && h === 0 ? `${m}m ${pad(s)}s` : `${h}h ${pad(m)}m`;
  }

  /* ------------------------------- quips ------------------------------- */
  const QUIPS = {
    in:  ["Clocked in. The grind begins. 💼", "You're inside! Coffee counts as work. ☕",
          "Badge beeped. Timer running. ⏱️", "Back at it. Look busy. 👀",
          "The chair missed you. 🪑", "Focus mode: allegedly on. 🧠"],
    out: ["Stepped out. Timer paused. 🧊", "Break well earned. 🍵",
          "Escaped! Temporarily. 🚪", "Clock's chilling till you're back. 😌",
          "Snack run detected. 🍪", "Touching grass. Approved. 🌿"],
    dblIn:  ["You're already inside, champ. 😅", "Can't enter twice. Physics. 🙃"],
    dblOut: ["You're not even in yet! 🤨", "Swipe in first, escape later. 🚧"],
    done:   ["4 hours cleared — you're free! 🎉", "Target hit. Go live your life. 🥳"]
  };
  const pick = a => a[Math.floor(Math.random() * a.length)];

  function say(text) {
    el.quip.textContent = text;
    el.quip.classList.remove("pop");
    void el.quip.offsetWidth;          // restart the animation
    el.quip.classList.add("pop");
  }

  /* -------------------------------- fx --------------------------------- */
  function flyEmoji(btn, chars) {
    const r = btn.getBoundingClientRect();
    for (let i = 0; i < 6; i++) {
      const n = document.createElement("div");
      n.className = "flyer";
      n.textContent = chars[i % chars.length];
      n.style.left = r.left + r.width * (0.2 + Math.random() * 0.6) + "px";
      n.style.top = r.top + r.height * 0.4 + "px";
      n.style.setProperty("--dx", (Math.random() * 90 - 45).toFixed(0) + "px");
      n.style.setProperty("--rot", (Math.random() * 90 - 45).toFixed(0) + "deg");
      n.style.animationDelay = (i * 45) + "ms";
      el.fx.appendChild(n);
      setTimeout(() => n.remove(), 1200);
    }
  }

  function confetti() {
    const colors = ["#12a150", "#f5b301", "#16150f", "#e0663c", "#3b82f6"];
    for (let i = 0; i < 70; i++) {
      const n = document.createElement("div");
      n.className = "confetti";
      n.style.left = Math.random() * 100 + "vw";
      n.style.background = colors[i % colors.length];
      n.style.animationDuration = (1.9 + Math.random() * 1.6) + "s";
      n.style.animationDelay = (Math.random() * 0.5) + "s";
      el.fx.appendChild(n);
      setTimeout(() => n.remove(), 4200);
    }
  }

  function nope(btn, msgs) {
    btn.classList.remove("nope");
    void btn.offsetWidth;
    btn.classList.add("nope");
    say(pick(msgs));
  }

  /* ------------------------------- render ------------------------------ */
  function render() {
    const now = Date.now();
    const inside = insideMs(now);
    const left = Math.max(0, TARGET - inside);
    const done = inside >= TARGET;
    const active = isIn();
    const at = logoutAt(now);

    el.logout.className = "time" + (done ? " done" : at === null ? " pending" : "");
    if (at !== null) el.logout.innerHTML = fmtClock(at).replace(/\s?([AP]M)$/i, "<em>$1</em>");
    else el.logout.textContent = sessions.length ? "paused" : "—:—";

    if (done)                 el.sub.innerHTML = `Free since <b>${fmtClock(at)}</b> — go home 🎉`;
    else if (active)          el.sub.innerHTML = `<b>${fmtDur(left, true)}</b> to go · inside ${fmtDur(inside)}`;
    else if (sessions.length) el.sub.innerHTML = `Swipe in now → out at <b>${fmtClock(now + left)}</b>`;
    else                      el.sub.innerHTML = `Swipe in to start the 4-hour clock`;

    el.btnIn.disabled = active;
    el.btnOut.disabled = !active;
    el.btnReset.hidden = sessions.length === 0;

    if (done && !celebrated) {
      celebrated = true;
      confetti();
      say(pick(QUIPS.done));
      save();
    }
  }

  /* ------------------------------ actions ------------------------------ */
  el.btnIn.addEventListener("click", () => {
    if (isIn()) return nope(el.btnIn, QUIPS.dblIn);
    sessions.push({ in: Date.now(), out: null });
    flyEmoji(el.btnIn, ["✅", "💼", "⚡", "🚀"]);
    say(pick(QUIPS.in));
    save(); render();
  });

  el.btnOut.addEventListener("click", () => {
    if (!isIn()) return nope(el.btnOut, QUIPS.dblOut);
    sessions[sessions.length - 1].out = Date.now();
    flyEmoji(el.btnOut, ["🏃", "💨", "🍃", "🎈"]);
    say(pick(QUIPS.out));
    save(); render();
  });

  // Reset confirms in place — no browser dialog.
  let armed = null;
  el.btnReset.addEventListener("click", () => {
    if (!armed) {
      el.btnReset.textContent = "Sure? Tap again";
      el.btnReset.classList.add("armed");
      armed = setTimeout(disarm, 3000);
      return;
    }
    clearTimeout(armed); disarm();
    sessions = []; celebrated = false;
    say("Clean slate. Pretend today just started. 🧼");
    save(); render();
  });

  function disarm() {
    armed = null;
    el.btnReset.textContent = "Reset day";
    el.btnReset.classList.remove("armed");
  }

  // pointer-tracked shine
  for (const b of [el.btnIn, el.btnOut]) {
    b.addEventListener("pointermove", e => {
      const r = b.getBoundingClientRect();
      b.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 100) + "%");
      b.style.setProperty("--my", ((e.clientY - r.top) / r.height * 100) + "%");
    });
  }

  /* -------------------------------- boot ------------------------------- */
  load();
  render();
  setInterval(render, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
