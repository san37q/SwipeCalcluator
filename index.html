<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shift Clock</title>
<style>
  :root{
    --bg: #1c1f22;
    --bg-card: #22262a;
    --bg-row: #26292d;
    --line: #34393e;
    --text: #f2f0eb;
    --text-dim: #9aa0a5;
    --amber: #e8a33d;
    --green: #6fae7c;
    --red: #c8654f;
    --blue: #7fa8c9;
    --mono: 'Courier New', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow-y: auto;
  }

  body{
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:flex-start;
    padding: 40px 24px;
  }

  .ticket{
    width: 100%;
    max-width: 380px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 28px 28px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  .ticket::before,
  .ticket::after{
    content:"";
    position:absolute;
    left: -8px; right:-8px;
    height: 16px;
    background-image: radial-gradient(circle, var(--bg) 5px, transparent 5.5px);
    background-size: 20px 20px;
    background-position: 0 center;
  }
  .ticket::before{ top: -8px; }
  .ticket::after{ bottom: -8px; }

  .eyebrow{
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 6px;
    text-align:center;
  }

  .pill{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 4px 0 20px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--text-dim); }
  .pill.working .dot{ background: var(--amber); box-shadow: 0 0 0 4px rgba(232,163,61,0.15); }
  .pill.working{ color: var(--amber); }
  .pill.break .dot{ background: var(--blue); }
  .pill.break{ color: var(--blue); }
  .pill.done .dot{ background: var(--green); }
  .pill.done{ color: var(--green); }
  .pill.idle .dot{ background: var(--text-dim); }
  .pill.idle{ color: var(--text-dim); }

  .status{
    display:flex;
    justify-content: space-between;
    align-items:center;
    padding: 12px 14px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .status .label{ color: var(--text-dim); }
  .status .value{
    font-family: var(--mono);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .buttons{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    margin: 26px 0 26px;
    justify-items: center;
  }

  .buzzer-wrap{
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 10px;
  }

  .buzzer-label{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  button{
    font-family: var(--sans);
    cursor: pointer;
    border: none;
    -webkit-tap-highlight-color: transparent;
  }

  .buzzer{
    width: 110px;
    height: 110px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.55);
    background: radial-gradient(circle at 32% 28%, #4a4f54, #2a2e32 60%, #24272b 100%);
    box-shadow:
      0 8px 0 0 #17191b,
      0 10px 14px rgba(0,0,0,0.45),
      inset 0 2px 3px rgba(255,255,255,0.08);
    transition: box-shadow 0.06s ease, filter 0.15s ease;
  }

  @keyframes buzzBounce{
    0%{ transform: scale(0.88) translateY(3px); }
    45%{ transform: scale(1.14) translateY(-5px); }
    72%{ transform: scale(0.96) translateY(1px); }
    100%{ transform: scale(1) translateY(0); }
  }

  @keyframes rippleAnim{
    from{ transform: translate(-50%,-50%) scale(0); opacity: 0.6; }
    to{ transform: translate(-50%,-50%) scale(5.5); opacity: 0; }
  }

  .ripple{
    position:absolute;
    top: var(--ry);
    left: var(--rx);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(255,255,255,0.75);
    transform: translate(-50%,-50%) scale(0);
    animation: rippleAnim 0.55s ease-out forwards;
    pointer-events: none;
  }

  @keyframes buzzFlash{
    0%{ filter: brightness(1.9) saturate(1.3); }
    100%{ filter: brightness(1) saturate(1); }
  }

  .buzzer.buzz-hit{
    animation: buzzBounce 0.38s cubic-bezier(.34,1.56,.64,1), buzzFlash 0.3s ease-out;
  }

  .buzzer::after{
    content:"";
    position:absolute;
    inset: 10px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.15);
    pointer-events:none;
  }

  .buzzer:not(:disabled):active{
    transform: translateY(6px);
    box-shadow:
      0 2px 0 0 #17191b,
      0 3px 6px rgba(0,0,0,0.4),
      inset 0 2px 3px rgba(255,255,255,0.08);
  }

  .buzzer:disabled{
    opacity: 0.32;
    cursor: not-allowed;
  }

  #swipeIn.buzzer:not(:disabled){
    background: radial-gradient(circle at 32% 28%, #9fd4a8, var(--green) 55%, #3f7a4c 100%);
    box-shadow:
      0 8px 0 0 #244a2c,
      0 10px 16px rgba(111,174,124,0.35),
      inset 0 2px 3px rgba(255,255,255,0.35);
    color: #10250f;
  }
  #swipeIn.buzzer:not(:disabled):hover{ filter: brightness(1.06); }
  #swipeIn.buzzer:not(:disabled):active{
    box-shadow:
      0 2px 0 0 #244a2c,
      0 4px 8px rgba(111,174,124,0.3),
      inset 0 2px 3px rgba(255,255,255,0.25);
  }

  #swipeOut.buzzer:not(:disabled){
    background: radial-gradient(circle at 32% 28%, #e28f78, var(--red) 55%, #9c4632 100%);
    box-shadow:
      0 8px 0 0 #6e2f20,
      0 10px 16px rgba(200,101,79,0.35),
      inset 0 2px 3px rgba(255,255,255,0.3);
    color: #351108;
  }
  #swipeOut.buzzer:not(:disabled):hover{ filter: brightness(1.06); }
  #swipeOut.buzzer:not(:disabled):active{
    box-shadow:
      0 2px 0 0 #6e2f20,
      0 4px 8px rgba(200,101,79,0.3),
      inset 0 2px 3px rgba(255,255,255,0.2);
  }

  .logout-panel{
    border-top: 1px solid var(--line);
    padding-top: 18px;
    text-align:center;
  }

  .logout-label{
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 6px;
  }

  .logout-time{
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    margin: 0 0 4px;
  }

  .logout-note{
    font-size: 12px;
    color: var(--text-dim);
    min-height: 16px;
  }

  .reset-row{
    text-align:center;
    margin-top: 18px;
  }

  .reset-link{
    background:none;
    border:none;
    color: var(--text-dim);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }
  .reset-link:hover{ color: var(--text); }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }

  .watermark{
    margin-top: 18px;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--text);
    opacity: 0.85;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="ticket">
    <div class="pill idle" id="statusPill">
      <span class="dot"></span>
      <span id="statusText">Not started</span>
    </div>

    <div class="status">
      <span class="label">Worked today</span>
      <span class="value" id="workedValue">0h 00m</span>
    </div>
    <div class="status">
      <span class="label">Remaining</span>
      <span class="value" id="remainingValue">4h 00m</span>
    </div>

    <div class="buttons">
      <div class="buzzer-wrap">
        <button class="buzzer" id="swipeIn">In</button>
        <span class="buzzer-label">Swipe In</span>
      </div>
      <div class="buzzer-wrap">
        <button class="buzzer" id="swipeOut" disabled>Out</button>
        <span class="buzzer-label">Swipe Out</span>
      </div>
    </div>

    <div class="logout-panel">
      <p class="logout-label">Projected logout</p>
      <p class="logout-time" id="logoutTime">—:—:—</p>
      <p class="logout-note" id="logoutNote">Swipe in to start your shift.</p>
    </div>

    <div class="reset-row">
      <button class="reset-link" id="resetBtn">reset today</button>
    </div>
  </div>

  <p class="watermark">a Sandeep Kumar production</p>

<script>
  (function(){
    var SHIFT_MS = 4 * 60 * 60 * 1000; // 4 hours of actual work, breaks excluded

    var STORAGE_KEY = 'shiftClockV2';

    var els = {
      statusPill: document.getElementById('statusPill'),
      statusText: document.getElementById('statusText'),
      workedValue: document.getElementById('workedValue'),
      remainingValue: document.getElementById('remainingValue'),
      swipeInBtn: document.getElementById('swipeIn'),
      swipeOutBtn: document.getElementById('swipeOut'),
      logoutTime: document.getElementById('logoutTime'),
      logoutNote: document.getElementById('logoutNote'),
      resetBtn: document.getElementById('resetBtn')
    };

    function todayKey(d){
      d = d || new Date();
      return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
    }

    function loadState(){
      try{
        var raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return null;
        var state = JSON.parse(raw);
        if(state.day !== todayKey()) return null; // fresh day, fresh state
        return state;
      }catch(e){ return null; }
    }

    function saveState(state){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    var state = loadState() || { day: todayKey(), sessions: [] };

    function activeSession(){
      var last = state.sessions[state.sessions.length - 1];
      return (last && last.outAt === null) ? last : null;
    }

    function completedMs(){
      var sum = 0;
      state.sessions.forEach(function(s){
        if(s.outAt !== null) sum += (s.outAt - s.inAt);
      });
      return sum;
    }

    function totalWorkedMs(now){
      var active = activeSession();
      return completedMs() + (active ? (now - active.inAt) : 0);
    }

    function fmtTime(ts){
      if(!ts && ts !== 0) return '—';
      var d = new Date(ts);
      return d.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit', second:'2-digit' });
    }

    function fmtHM(ms){
      var totalMin = Math.floor(ms / 60000);
      var h = Math.floor(totalMin / 60);
      var m = totalMin % 60;
      return h + 'h ' + (m < 10 ? '0' : '') + m + 'm';
    }

    function render(){
      var now = Date.now();
      var active = activeSession();
      var completed = completedMs();
      var worked = totalWorkedMs(now);
      var remaining = Math.max(0, SHIFT_MS - worked);

      els.workedValue.textContent = fmtHM(worked);
      els.remainingValue.textContent = remaining > 0 ? fmtHM(remaining) : 'Target reached';

      els.swipeInBtn.disabled = !!active;
      els.swipeOutBtn.disabled = !active;

      els.statusPill.className = 'pill';
      if(active){
        els.statusPill.classList.add('working');
        els.statusText.textContent = 'Working';
      } else if(state.sessions.length === 0){
        els.statusPill.classList.add('idle');
        els.statusText.textContent = 'Not started';
      } else if(remaining <= 0){
        els.statusPill.classList.add('done');
        els.statusText.textContent = 'Target reached';
      } else {
        els.statusPill.classList.add('break');
        els.statusText.textContent = 'On break';
      }

      // Projected logout is only shown while actively swiped in. Any gap
      // between a swipe-out and the next swipe-in is a break and is never
      // counted toward the 4h target or the projection.
      if(active){
        var projectedLogout = active.inAt + (SHIFT_MS - completed);
        els.logoutTime.textContent = fmtTime(projectedLogout);
        if(now >= projectedLogout){
          els.logoutNote.textContent = '4h00 of work reached — swipe out any time';
        } else {
          els.logoutNote.textContent = 'excludes breaks taken so far';
        }
      } else {
        els.logoutTime.textContent = '—:—:—';
        if(state.sessions.length === 0){
          els.logoutNote.textContent = 'Swipe in to start your shift.';
        } else if(remaining <= 0){
          els.logoutNote.textContent = '4h00 of work completed today';
        } else {
          els.logoutNote.textContent = 'On break — ' + fmtHM(remaining) + ' of work still needed';
        }
      }
    }

    function tickClock(){
      render();
    }

    function fireBuzzFx(btn, evt){
      // ripple from the click/tap point
      var rect = btn.getBoundingClientRect();
      var x = (evt.touches && evt.touches[0] ? evt.touches[0].clientX : evt.clientX) - rect.left;
      var y = (evt.touches && evt.touches[0] ? evt.touches[0].clientY : evt.clientY) - rect.top;
      if(isNaN(x) || isNaN(y)){ x = rect.width / 2; y = rect.height / 2; }

      var ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.setProperty('--rx', x + 'px');
      ripple.style.setProperty('--ry', y + 'px');
      btn.appendChild(ripple);
      ripple.addEventListener('animationend', function(){ ripple.remove(); });

      // bounce + flash
      btn.classList.remove('buzz-hit');
      // force reflow so the animation can restart if clicked rapidly
      void btn.offsetWidth;
      btn.classList.add('buzz-hit');
      btn.addEventListener('animationend', function handler(){
        btn.classList.remove('buzz-hit');
        btn.removeEventListener('animationend', handler);
      });

      if(navigator.vibrate){
        try{ navigator.vibrate(12); }catch(e){}
      }
    }

    els.swipeInBtn.addEventListener('click', function(evt){
      if(activeSession()) return;
      fireBuzzFx(els.swipeInBtn, evt);
      if(state.day !== todayKey()){
        state = { day: todayKey(), sessions: [] };
      }
      state.sessions.push({ inAt: Date.now(), outAt: null });
      saveState(state);
      render();
    });

    els.swipeOutBtn.addEventListener('click', function(evt){
      var active = activeSession();
      if(!active) return;
      fireBuzzFx(els.swipeOutBtn, evt);
      active.outAt = Date.now();
      saveState(state);
      render();
    });

    els.resetBtn.addEventListener('click', function(){
      state = { day: todayKey(), sessions: [] };
      saveState(state);
      render();
    });

    tickClock();
    setInterval(tickClock, 1000);
  })();
</script>

</body>
</html>
